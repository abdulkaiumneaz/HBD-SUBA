<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Surprise for Suba</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <main
        class="welcome-page"
        id="welcomePage"
    >


        <!-- Falling Background -->

        <div
            class="falling-layer"
            aria-hidden="true"
        >

            <span class="fall-item item-one">🌸</span>
            <span class="fall-item item-two">🌷</span>
            <span class="fall-item item-three">💗</span>
            <span class="fall-item item-four">🌸</span>

            <span class="fall-item item-five">💖</span>
            <span class="fall-item item-six">🌷</span>
            <span class="fall-item item-seven">🌸</span>
            <span class="fall-item item-eight">💕</span>

            <span class="fall-item item-nine">🌸</span>
            <span class="fall-item item-ten">💗</span>
            <span class="fall-item item-eleven">🌷</span>
            <span class="fall-item item-twelve">🌸</span>

            <span class="fall-item item-thirteen">💞</span>
            <span class="fall-item item-fourteen">🌸</span>

        </div>


        <!-- Main Content -->

        <div class="welcome-content">


            <!-- Top Small Text -->

            <p class="intro-text">
                A Sweet Surprise Awaits...
            </p>


            <!-- Main Title -->

            <h1 class="cake-title">

                One Cut Away From

                <span>
                    Something Special
                </span>

            </h1>


            <!-- Birthday Cake -->

            <div
                class="cake-wrapper"
                id="cakeWrapper"
            >

                <button
                    type="button"
                    class="cake-button"
                    id="cakeButton"
                    aria-label="Cut the birthday cake"
                >

                    <div class="cake-3d">


                        <!-- Plate -->

                        <div class="cake-plate"></div>


                        <!-- Left Half -->

                        <div
                            class="cake-piece cake-piece-left"
                        >

                            <div class="bottom-tier"></div>

                            <div class="bottom-icing"></div>

                            <div class="top-tier"></div>

                            <div class="top-icing"></div>

                        </div>


                        <!-- Right Half -->

                        <div
                            class="cake-piece cake-piece-right"
                        >

                            <div class="bottom-tier"></div>

                            <div class="bottom-icing"></div>

                            <div class="top-tier"></div>

                            <div class="top-icing"></div>

                        </div>


                        <!-- Candles -->

                        <div
                            class="birthday-candle candle-left"
                        >

                            <div class="candle-flame"></div>

                        </div>


                        <div
                            class="birthday-candle candle-middle"
                        >

                            <div class="candle-flame"></div>

                        </div>


                        <div
                            class="birthday-candle candle-right"
                        >

                            <div class="candle-flame"></div>

                        </div>


                        <!-- Cutting Line -->

                        <div class="cake-cut-line"></div>


                    </div>

                </button>

            </div>


            <!-- Cut The Cake Button -->

            <button
                type="button"
                class="press-button"
                id="pressButton"
            >

                Cut the Cake

                <span>✨</span>

            </button>


            <!-- Bottom Hint -->

            <p class="hint-text">
                Tap the cake or press the button
            </p>


        </div>

    </main>


    <!-- Main JavaScript -->

    <script src="script.js"></script>

</body>

</html>
